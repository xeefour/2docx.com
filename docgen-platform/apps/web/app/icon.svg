<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="2docx.com">
  <!--
    ไอคอนเว็บแอป — สีต้องตรงกับ `manual/assets/icon.svg` และกับโทเคนใน STYLE.md ข้อ 2
    ── ทำไมถึงเขียนสีตรง ๆ ไม่ใช้โทเคน CSS ────────────────────────────────────────
      ไฟล์นี้ถูก `<link rel="icon">` โหลด**นอก DOM** จึงไม่มีทางรับ `var(--brand)` จากธีม
      และไอคอนเป็นสิ่งที่เห็นบนแท็บเบราว์เซอร์ซึ่งพื้นหลังเราไม่ได้ควบคุมได้
      → ต้องเลือกค่าที่อ่านออกทั้งบนแท็บสว่างและแท็บมืด จึงใช้สีแบรนด์โหมดสว่าง (#1d6f5c)
         ซึ่งเข้มพอจะเห็นบนทั้งสองพื้น (วัดแล้ว: กับขาว 6.03:1 · กับดำ 3.48:1)
         ตัวเลขมาจาก `node logs/check-icon-color.mjs` — แก้สีแล้วให้รันใหม่

    ⚠️ ห้ามย้ายคอมเมนต์นี้ไปไว้**ก่อน** `<svg>` อีก
      Next.js ใช้ `app/icon.svg` เป็น metadata image และรันผ่าน image loader
      ถ้ามีอะไรมาก่อนราก `<svg>` loader จะตอบว่า "not a valid image file" แล้ว build ล้ม
      (เจอจริงรอบนี้ — คอมเมนต์นอกรากทำให้ `next build` ล้มทันที)

    ⚠️ เคยเป็นม่วง #6d3bbf ตอนเปลี่ยนธีมทั้งเว็บแล้วลืมไฟล์นี้
      ผลคือเปิดเว็บแล้วเห็นไอคอนสีคนละแบรนด์กับทั้งเว็บ โดยไม่มี error
  -->
  <rect width="32" height="32" rx="7" fill="#1d6f5c"/>
  <!-- หน้ากระดาษ -->
  <path d="M11 6.5h7.6L24 11.9V25a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1z" fill="#ffffff"/>
  <!-- มุมที่พับ -->
  <path d="M18.6 6.5v5.4H24z" fill="#d9e8e2"/>
  <!-- บรรทัดข้อความ -->
  <g fill="#1d6f5c">
    <rect x="13" y="15" width="8" height="1.8" rx="0.9"/>
    <rect x="13" y="19" width="8" height="1.8" rx="0.9"/>
    <rect x="13" y="23" width="5" height="1.8" rx="0.9"/>
  </g>
</svg>
# ─────────────────────────────────────────────────────────────
#  Override สำหรับ debug จาก host เท่านั้น — ห้ามใช้ตอน production
#
#    docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#
#  ปกติทุก service คุยกันผ่าน network `infra` และไม่มีพอร์ตไหนออกเครื่อง
#  ไฟล์นี้มีไว้ให้เข้าไปยิง API ตรง ๆ จากเครื่องตอนหาบั๊ก
#  เช่น `curl http://127.0.0.1:4001/api/health`
#
#  ⚠️ ผูก 127.0.0.1 เท่านั้น (ไม่ใช่ 0.0.0.0 แบบที่เคยเป็น)
#     คนใน LAN เข้าไม่ได้ ต่างจากเดิมที่เปิดทั้งเครื่อง
# ─────────────────────────────────────────────────────────────
services:
  api:
    ports:
      - "127.0.0.1:4001:4000"

  web:
    ports:
      - "127.0.0.1:3000:3000"

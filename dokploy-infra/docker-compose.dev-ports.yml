# ─────────────────────────────────────────────────────────────
#  DEV ONLY — publish พอร์ตออกมาให้ host ใช้ได้
#
#    docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#
#  ── ทำไมต้องมีไฟล์นี้ ────────────────────────────────────────
#    production Docker ไม่ map พอร์ตออกมาภายนอกเลย (ผู้ใช้สั่ง 2026-10-06)
#      ไฟล์หลักจึงไม่มี ports: แม้แต่บรรทัดเดียว
#      เข้าถึงระบบจากภายนอกได้ทางเดียว: reverse proxy / tunnel ที่วิ่งเข้า
#      พอร์ต 80 ของ container โดยตรง (ไม่ผ่านพอร์ตของ host)
#    ไฟล์นี้คือ "ประตูทางเข้า" สำหรับนักพัฒนาบนเครื่องนี้เท่านั้น
#
#  ⚠️ ผูก 127.0.0.1 เท่านั้น (ห้าม 0.0.0.0 ที่ Docker ผูกให้ถ้าไม่ระบุ)
#     ห้าม LAN เข้าตรง ผ่าน gateway ที่ 127.0.0.1:8090 เท่านั้น
#     แก้เมื่อ 2026-10-05 — เคยเป็น 0.0.0.0 แล้ววัดได้ว่าเข้าจาก LAN ได้จริง (200)
#  ⚠️ ต้องอยู่ใน .gitignore (ค่าพอร์ต dev ไม่ต้องติดตามที่ production)
#     ตรวจโดย check-prod-env.mjs ข้อ 5
# ─────────────────────────────────────────────────────────────
services:
  # ── ทางเข้าหลักของระบบ ──────────────────────────────────────
  gateway:
    ports:
      - "127.0.0.1:8090:80"

  # ── แอป ────────────────────────────────────────────────────
  # ⚠️ web:3000 **ตัดออกโดยตั้งใจ** (2026-10-06)
  #   · `docker compose up` จะล้มทั้งชุดถ้าพอร์ตนี้ถูกจอง
  #     เกิดจริง: Next dev server บน host ค้างฟังที่ 3000 (node start-server.js)
  #     แล้ว Docker bind ไม่ขึ้น → ทั้ง stack ไม่สตาร์ต (เจอตอนทดสอบจริง)
  #   · ไม่ต้องเปิดก็ได้ เพราะ gateway ที่ 127.0.0.1:8090 proxy เข้า web:3000 อยู่แล้ว
  #   · ถ้าจำเป็นต้องแตะเว็บตรง ให้เลือกอย่างใดอย่างหนึ่ง:
  #       · host dev server  (npm run dev ใน apps/web)  → พอร์ต 3000
  #       · หรือ uncomment บรรทัดด้านล่าง **หลังปิด host dev server แล้ว**
  # web:
  #   ports:
  #     - "127.0.0.1:3000:3000"
  api:
    ports:
      # ⚠️ พอร์ตนี้ชนกันได้ถ้าคุณรัน `npm run dev` ใน apps/api พร้อมกัน
      #   (dev script ของ api ฟังที่ 4001 บน host ด้วย)
      - "127.0.0.1:4001:4000"

  # ── หน้า /analyze — ไม่มี auth ─────────────────────────────────
  # ปกติเข้าผ่าน gateway ที่ 127.0.0.1:8090/analyze ก็พอ
  # เพิ่มพอร์ตนี้เมื่อต้อง debug ตัว server โดยตรง (เช่น ดู log ตอน crash)
  log-analyzer:
    ports:
      - "127.0.0.1:3110:3110"

  # ── ฐานข้อมูล ───────────────────────────────────────────────
  # พอร์ต mongo-2/3 ต้องมีให้ host หา primary จริงเพื่อเขียน MONGO_URL
  #   (ดู .env.development → MONGO_PRIMARY_CANDIDATES)
  mongo-1:
    ports:
      - "127.0.0.1:27017:27017"
  mongo-2:
    ports:
      - "127.0.0.1:27018:27017"
  mongo-3:
    ports:
      - "127.0.0.1:27019:27017"

  # ── cache / คิว / เก็บไฟล์ ──────────────────────────────────
  # 16379 ไม่ใช่ 6379 — เครื่องนี้มี Redis บน WSL จอง 6379 ไว้แล้ว
  valkey:
    ports:
      - "127.0.0.1:16379:6379"
  nats:
    ports:
      - "127.0.0.1:4222:4222"    # client
      - "127.0.0.1:8222:8222"    # monitoring
      - "127.0.0.1:8081:8080"    # websocket (host 8081 เพราะ 8080 ถูก rustfs-ui ใช้แล้ว)
  rustfs:
    ports:
      - "127.0.0.1:9000:9000"
  rustfs-ui:
    ports:
      - "127.0.0.1:8080:8080"    # UI ไม่มี auth — ผูกแค่ localhost

  # ── observability ───────────────────────────────────────────
  # Loki ไม่มี auth_enabled → ห้ามเปิดออกนอกเครื่องเด็ดขาด
  loki:
    ports:
      - "127.0.0.1:3100:3100"
  alloy:
    ports:
      - "127.0.0.1:12345:12345"  # UI/debug ของ Alloy เอง

  # ── docserver (เรนเดอร์เอกสาร) ─────────────────────────────
  #   ทำไมถึงคืนพอร์ตนี้ (ตอนนี้จึงเปิดได้เฉพาะตอน dev)
  #     · ในโหมด dev สคริปต์/เครื่องมือบน host ต้องยิง docserver ตรง ๆ
  #       (worker ใน container ใช้ชื่อ service `docserver` ไม่เกี่ยวกัน)
  #     · ผูก 127.0.0.1 จึงไม่กลับไปเปิดช่องที่เคยเป็นปัญหา
  #       (เดิมเป็น `4000:4000` ซึ่ง Docker ผูก 0.0.0.0 → LAN เข้าได้จริง)
  #     · ถ้า dev server ที่รันบน host ยิง docserver ไม่ได้
  #       ให้รัน compose โดยมีไฟล์นี้
  docserver:
    ports:
      - "127.0.0.1:4000:4000"
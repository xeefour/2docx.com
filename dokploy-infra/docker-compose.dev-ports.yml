# ─────────────────────────────────────────────────────────────
#  Override สำหรับ debug — publish พอร์ตของ api + web ออกมา
#
#    docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#
#  ⚠️ ผูก 127.0.0.1 เท่านั้น (ห้าม 0.0.0.0 ที่ Docker ผูกให้ถ้าไม่ระบุ)
#     ห้าม LAN เข้าตรง ผ่าน gateway ที่ 127.0.0.1:8090 เท่านั้น
#     แก้เมื่อ 2026-10-05 — เคยเป็น 0.0.0.0 แล้ววัดได้ว่าเข้าจาก LAN ได้จริง (200)
# ─────────────────────────────────────────────────────────────
services:
  api:
    ports:
      - "127.0.0.1:4001:4000"

  web:
    ports:
      - "127.0.0.1:3000:3000"

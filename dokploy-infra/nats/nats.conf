# ─────────────────────────────────────────────────────────────
#  NATS + JetStream  —  ทำหน้าที่เป็น Queue
#  ค่า $NATS_PASSWORD ถูก resolve จาก environment ของ container
#  ⚠️ อย่าใส่ quote ครอบ $NATS_PASSWORD ไม่งั้นจะกลายเป็น string ตรง ๆ
#  ⚠️ อย่าให้ password ขึ้นต้นด้วยตัวเลข (NATS resolve ค่าเลขเป็นตัวเลข)
# ─────────────────────────────────────────────────────────────

server_name: nats-dokploy

# Client (Node/Python/Go) เข้ามาที่ port นี้
host: 0.0.0.0
port: 4222

# Monitoring endpoint — ใช้ดู health/status เท่านั้น อย่าวาง public
http_port: 8222
max_payload: 1MB

# ── JetStream: persistence layer ของ NATS ────────────────────
jetstream: enabled
jetstream {
  store_dir: "/data"

  # กัน memory ตลาดแล้ว NATS crash
  max_memory_store: 256MB
  max_file_store: 2GB
}

# ── WebSocket: ทางออกสำหรับ client ที่เป็น browser ─────────────
# เปิดใช้เมื่อมี frontend/mobile ต่อเข้ามาโดยตรง ไม่ต้องเขียน Worker bridge
websocket {
  port: 8080
  no_tls: true
  compression: true
}

# ── Auth ─────────────────────────────────────────────────────
authorization {
  timeout: 3

  users: [
    {
      user: "app"
      password: $NATS_PASSWORD

      permissions: {
        # $JS.API.> คือ API ของ JetStream (สร้าง stream/consumer, ดูข้อมูล)
        #   ขาดไปแล้ว client จะใช้ stream/consumer ไม่ได้
        #
        # ⚠️ $JS.ACK.> คือ subject ที่ JetStream ใช้รับ ack/nak/term จาก consumer
        #   ขาดไป = ack ถูกปฏิเสธแบบเงียบ (ไม่มี error กลับ client)
        #   ผลคือ งานไม่ถูก ack, ไม่มี retry, ack_floor ค้างที่ 0
        #   ต้องอยู่ฝั่ง publish เพราะ ack คือการ publish ไปที่ subject นั้น
        publish: {
          allow: ["jobs.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        }
        subscribe: {
          allow: ["jobs.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        }
      }
    }
  ]
}

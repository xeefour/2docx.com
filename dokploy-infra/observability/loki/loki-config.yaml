# ─────────────────────────────────────────────────────────────
#  Loki 3.7.8 — single binary + filesystem storage
#
#  ทำตามโครงสร้าง local-config.yaml ของ Loki 3.x (tsdb / v13)
#  ปรับ 3 จุดจากค่า default:
#    1. retention 14 วัน (336h) แทนไม่จำกัด
#    2.จำกัดอัตรารับ log ไว้ที่ 4 MB/s (กัน log รัวเต็มดิสก์)
#    3. ปิด analytics reporting
#
#  ⚠️ ประมาณการพื้นที่: ตัว mongo เดิมผลิต log ~260 MB/วัน แต่ Alloy ตัด
#     noise ก่อนส่งเข้า Loki (ดู stage.drop ใน alloy/config.alloy)
#     คาดว่าเหลือ ~20-40 MB/วัน → 14 วัน ≈ 300-600 MB
# ─────────────────────────────────────────────────────────────

auth_enabled: false          # ไม่มี auth ชั้นใด → ผูก 127.0.0.1 เท่านั้น

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1      # single binary
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01       # วันที่เริ่มใช้ schema v13 (ต้องเก่ากว่าวันแรกที่รัน)
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true            # ⬅️ เปิดการลบของเก่า
  delete_request_store: filesystem   # ⬅️ ต้องมี ไม่งั้น retention ไม่ทำงาน

limits_config:
  # เก็บย้อนหลัง 14 วัน — ต้องตรงกับ compactor.retention_enabled
  retention_period: 336h
  max_query_lookback: 336h

  # กัน log รัวกินพื้นที่ (mongo เคยผลิต ~3.5 MB/ชั่วโมงต่อ node)
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

  # ตอน dev ปล่อยบรรทัดเก่ากว่า 7 วัน (Loki ปฏิเสธเดี๋ยว ๆ)
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

# คำค้นซ้ำ ๆ ใช้ cache ในตัว ตอน dev พอประหยัด CPU
query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# ไม่ได้ตั้ง ruler/alerting ไว้ → ตัดบล็อกออกเพื่อไม่ให้มี config ที่ไม่มีผล
# (ถ้าวันไหนอยากทำ alert rule ค่อยเพิ่มกลับ พร้อม retention_enabled อยู่แล้ว)

analytics:
  reporting_enabled: false

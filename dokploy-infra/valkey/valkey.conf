# ─────────────────────────────────────────────────────────────
#  Valkey  —  ทำหน้าที่เป็น Cache
#  ⚠️ ไฟล์นี้ไม่รองรับ ${ENV} — password ถูกส่งผ่าน --requirepass
#     ใน docker-compose.yml (ค่านั้น compose จะ interpolate ให้ก่อน)
# ─────────────────────────────────────────────────────────────

bind 0.0.0.0
port 6379
protected-mode yes

# ── Memory policy ───────────────────────────────────────────
# allkeys-lru = ตัวเลือกที่ปลอดภัยสำหรับ cache เพราะ instance นี้
# ไม่ถือข้อมูลที่ห้ามหาย  (อย่าจับคู่กับ queue data เด็ดขาด)
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence: ปิดทั้งหมด ──────────────────────────────────
# cache สร้างใหม่ได้จาก DB เสมอ ล้มทั้ง volume ไม่เป็นไร
# และถ้าเปิดไว้ RDB/AOF จะทำให้ fork กิน RAM เพิ่มโดยไม่ได้ประโยชน์
save ""
appendonly no

# ── ลด latency ──────────────────────────────────────────────
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# รวม memory ที่กระจายกลับมา ใช้ได้ถ้า server เป็น Linux 64-bit
activedefrag yes

# ── Logging ─────────────────────────────────────────────────
loglevel notice
logfile ""
